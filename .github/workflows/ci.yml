name: kimi-base CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node runtime/kimi-base.mjs selftest
      - run: node runtime/kimi-base.mjs doctor .
      - run: node --test tests/harness.test.mjs
      - run: node runtime/kimi-base.mjs manifest --check
      - run: node runtime/kimi-base.mjs pack-check
